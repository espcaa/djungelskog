services:
  ts-bot:
    image: tailscale/tailscale:latest
    hostname: ${DEVICE_NAME:?DEVICE_NAME must be set in .env}
    environment:
      - TS_USERSPACE=false
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY must be set in .env}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ts_data:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-djungelskog}:${POSTGRES_PASSWORD:-djungelskog}@db:5432/${POSTGRES_DB:-djungelskog}?sslmode=disable
    ports:
      - "${BOT_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djungelskog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djungelskog}
      POSTGRES_DB: ${POSTGRES_DB:-djungelskog}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djungelskog} -d ${POSTGRES_DB:-djungelskog}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  ts_data:
